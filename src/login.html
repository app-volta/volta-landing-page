<!DOCTYPE html>
<html lang="pt-BR" id="html-login">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="assets/img/content/logo.png" type="image/x-icon">
    <title>Volta - login</title>
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/login-cadastrar.css">
    <!--Fonte Belanosima-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Belanosima:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div id="container">
        <div class="lado-imagem" aria-hidden="true"></div>
        <div class="content">
            <a href="index.html">
                <img id="Logo-VOLTA" src="assets/img/content/Logo_VOLTA.png" alt="Logo do Volta">
            </a>
            <h1>Bem-vindo(a) de volta!</h1>
            <h2>Login</h2>
            <form method="get" action="empresa/lista.html">
                <label for="email">E-mail:</label>
                <input type="email" id="email" placeholder="E-mail" required>
                <label for="senha">Senha:</label>
                <input type="password" id="senha" class="input-senha" placeholder="Senha" required>

                <button type="submit">Login</button>
                <p>Ainda não tem uma conta? <a href="cadastrar.html">Cadastre-se</a></p>
            </form>
        </div>
    </div>
</body>
</html>
