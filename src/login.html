<!DOCTYPE html>
<html lang="en" id="html-login">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="assets/img/content/logo.png" type="image/x-icon">
    <title>Volta - login</title>
    <link rel="stylesheet" href="css/login-cadastrar.css">
    <!--Fonte Belanosima-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Belanosima:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div id="container">
        <img id="Logo-VOLTA" src="assets/img/content/Logo_VOLTA.png" alt="Logo do Volta">
        <h1>Bem vindo(a)</h1>
        <form method="post">
            <label for="email">E-mail:</label>
            <input type="email" id="email" name="email" placeholder="Email" required>
            <br>
            <label for="senha">Senha:</label>
            <input type="password" id="senha" class="input-senha" name="senha" placeholder="Senha" required>
            <br>

            <button type="submit">Entrar</button>
            <p>Ainda não tem uma conta? <a href="cadastrar.html">Cadastre-se</a></p>
        </form>
        <svg class="shape" width="1440" height="656" viewBox="0 0 1440 656" fill="none" xmlns="http://www.w3.org/2000/svg">
            <g opacity="0.4">
                <rect width="598.781" height="41.3074" transform="matrix(-0.522096 -0.852887 -0.852772 0.522283 1548.02 994.635)" fill="#5DA753"/>
                <path d="M1180.17 433.116L1176.39 522.447L1261.4 470.374L1180.17 433.116Z" fill="#5DA753"/>
            </g>
            <rect width="647.219" height="44.6489" transform="matrix(-0.602108 -0.798414 -0.798282 0.602284 1615.18 603.188)" fill="#5DA753"/>
            <path d="M1160.75 37.5287L1166.02 134.029L1252.04 69.1231L1160.75 37.5287Z" fill="#5DA753"/>
            <g opacity="0.7">
                <rect width="647.219" height="44.6489" transform="matrix(0.488172 -0.872747 0.87264 0.488364 -173.164 866.549)" fill="#5DA753"/>
                <path d="M200.283 243.448L208.157 339.77L114.128 287.14L200.283 243.448Z" fill="#5DA753"/>
            </g>
        </svg>
    </div>
</body>
</html>
