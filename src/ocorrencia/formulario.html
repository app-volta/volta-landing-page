<!DOCTYPE html>
<!-- lang="pt-BR": idioma da página (ajuda leitores de tela) -->
<html lang="pt-BR">
<head>
    <!-- Faz os acentos aparecerem corretamente -->
    <meta charset="UTF-8">
    <!-- Adapta a página à largura do celular (base da responsividade) -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Texto que aparece na aba do navegador -->
    <title>Ocorrência - Volta</title>
    <!-- ../ sobe uma pasta (de empresa/ para src/) antes de entrar em css/ -->
    <link rel="icon" href="../assets/img/content/logo.png" type="image/x-icon">
    <link rel="stylesheet" href="../css/app.css">
    <!-- Fonte Belanosima (a mesma da landing) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Belanosima:wght@400;600;700&display=swap" rel="stylesheet">
    <!-- Ícone do menu (o mesmo da landing) -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
    />
</head>
<body>

    <!-- MENU: início (o back troca este bloco por um include) -->
    <nav class="nav">
      <div class="menu">
        <input type="checkbox" id="menu-toggle" />

        <div class="nav-logo">
          <a href="../index.html">
            <img src="../assets/img/content/Logo_VOLTA_branco.png" alt="VOLTA Logo" />
          </a>

          <label
            for="menu-toggle"
            class="material-symbols-outlined"
            >menu</label
          >
        </div>

        <div class="nav-links">
            <a class="link-pagina" href="../empresa/lista.html">Empresas</a>
            <a class="link-pagina" href="../cooperativa/lista.html">Cooperativas</a>
            <a class="link-pagina" href="../area/lista.html">Áreas</a>
            <a class="link-pagina" href="../ocorrencia/lista.html">Ocorrências</a>
            <a class="link-pagina" href="../coleta/lista.html">Coletas</a>
            <a class="link-pagina" href="../usuario/lista.html">Usuários</a>
          <span class="usuario-logado">Nome do usuário</span>
          <form class="form-sair" method="post" action="../logout">
            <button type="submit" class="btn-sair">Sair</button>
          </form>
        </div>
      </div>
    </nav>
    <!-- MENU: fim -->

    <!-- main = conteúdo principal da página -->
    <main class="container">
        <!-- o mesmo formulário serve para criar (action=insert) e editar (action=update): o back troca o título, o action e o id -->
        <h2>Nova ocorrência</h2>
        <form method="post" action="../ocorrencia">
            <!-- campos escondidos: dizem ao servlet o que fazer -->
            <input type="hidden" name="action" value="insert">
            <input type="hidden" name="id" value="">

            <label for="companyName">Empresa</label>
            <input type="text" id="companyName" value="EcoPack Indústria de Embalagens" disabled>
            <input type="hidden" name="companyId" value="1">
            <label for="userId">Usuário</label>
            <select id="userId" name="userId" required>
                <option value="">Selecione...</option>
                <option value="1">Maria Souza</option>
                <option value="2">João Lima</option>
            </select>
            <label for="areaId">Área</label>
            <select id="areaId" name="areaId" required>
                <option value="">Selecione...</option>
                <option value="1">Produção</option>
                <option value="2">Estoque</option>
            </select>
            <label for="wasteTypeId">Tipo de resíduo</label>
            <select id="wasteTypeId" name="wasteTypeId" required>
                <option value="">Selecione...</option>
                <option value="1">Plástico PET</option>
                <option value="2">Plástico PEAD</option>
                <option value="3">Plástico PP</option>
                <option value="4">Plástico PVC</option>
            </select>
            <label for="priority">Prioridade</label>
            <select id="priority" name="priority" required>
                <option value="BAIXA">BAIXA</option>
                <option value="MEDIA" selected>MEDIA</option>
                <option value="ALTA">ALTA</option>
                <option value="URGENTE">URGENTE</option>
            </select>
            <label for="contaminationLevel">Nível de contaminação</label>
            <select id="contaminationLevel" name="contaminationLevel">
                <option value="">Não informado</option>
                <option value="BAIXO">BAIXO</option>
                <option value="MEDIO">MEDIO</option>
                <option value="ALTO">ALTO</option>
            </select>
            <label for="photoUrl">URL da foto</label>
            <input type="text" id="photoUrl" name="photoUrl">
            <label for="employeeDescription">Descrição do funcionário</label>
            <input type="text" id="employeeDescription" name="employeeDescription">
            <label for="estimatedWeight">Peso estimado (kg)</label>
            <input type="number" id="estimatedWeight" name="estimatedWeight" step="any">

            <div class="botoes">
                <button type="submit" class="btn">Salvar</button>
                <a class="btn btn-secundario" href="lista.html">Cancelar</a>
            </div>
        </form>
    </main>

</body>
</html>
