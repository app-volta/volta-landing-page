<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Usuários - Volta</title>
    <link rel="icon" href="../assets/img/content/logo.png" type="image/x-icon">
    <link rel="stylesheet" href="../css/app.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Belanosima:wght@400;600;700&display=swap" rel="stylesheet">
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
    />
</head>
<body>

    <nav class="nav">
      <div class="menu">
        <input type="checkbox" id="menu-toggle" />

        <div class="nav-logo">
          <a href="../index.html">
            <img src="../assets/img/content/Logo_VOLTA_branco.png" alt="VOLTA Logo" />
          </a>

          <label
            for="menu-toggle"
            class="material-symbols-outlined"
            >menu</label
          >
        </div>

        <div class="nav-links">
            <a class="link-pagina" href="../empresa/lista.html">Empresas</a>
            <a class="link-pagina" href="../cooperativa/lista.html">Cooperativas</a>
            <a class="link-pagina" href="../area/lista.html">Áreas</a>
            <a class="link-pagina" href="../ocorrencia/lista.html">Ocorrências</a>
            <a class="link-pagina" href="../coleta/lista.html">Coletas</a>
            <a class="link-pagina" href="../usuario/lista.html">Usuários</a>
          <span class="usuario-logado">Nome do usuário</span>
          <form class="form-sair" method="post" action="../logout">
            <button type="submit" class="btn-sair">Sair</button>
          </form>
        </div>
      </div>
    </nav>

    <main class="container">
        <h2>Usuários cadastrados</h2>
        <a class="btn" href="formulario.html">+ Novo usuário</a>

        <form class="form-inline" method="get" action="../usuario">
            <input type="hidden" name="action" value="list">
            <input type="text" name="name" placeholder="Filtrar por nome...">
            <select name="companyId">
                <option value="">Todas as empresas</option>
                <option value="1">EcoPack Indústria de Embalagens</option>
                <option value="2">Mercado Boa Compra</option>
            </select>
            <button type="submit">Filtrar</button>
        </form>

        <div class="tabela-responsiva">
            <table>
                <thead>
                    <tr>
                    <th>Nome</th>
                    <th>Email</th>
                    <th>Perfil</th>
                    <th>Cargo</th>
                    <th>Empresa / Cooperativa</th>
                    <th>Ações</th>
                    </tr>
                </thead>
                <tbody>
                </tbody>
            </table>
        </div>
    </main>

</body>
</html>
