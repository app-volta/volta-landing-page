<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="assets/img/content/logo.png" type="image/x-icon">
    <title>Volta - esqueci minha senha</title>
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/login-cadastrar.css">
    <!--Fonte Belanosima-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Belanosima:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div id="container">
        <div class="lado-imagem" aria-hidden="true"></div>
        <div class="content">
            <a href="index.html">
                <img id="Logo-VOLTA" src="assets/img/content/Logo_VOLTA.png" alt="Logo do Volta">
            </a>
            <h1>Criar uma nova senha</h1>
            <form method="post">
                <label for="email">E-mail:</label>
                <input type="email" id="email" name="email" placeholder="Email" required>
                <label for="nova-senha">Nova senha:</label>
                <input type="password" id="nova-senha" class="input-senha" name="nova-senha" placeholder="Nova senha" required>

                <button type="submit">Enviar email de confirmação</button>
                <p><a href="login.html">Voltar para o login</a></p>
            </form>
        </div>
    </div>
</body>
</html>
