<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="assets/img/content/logo.png" type="image/x-icon">
    <title>Volta - cadastrar</title>
    <link rel="stylesheet" href="css/login-cadastrar.css">
    <!--Fonte Belanosima-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Belanosima:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div id="container">
        <svg class="shape" width="1440" height="830" viewBox="0 0 1440 830" fill="none" xmlns="http://www.w3.org/2000/svg">
            <g opacity="0.7">
                <rect width="1384.17" height="56.4294" transform="matrix(0.966068 -0.258287 0.258804 0.96593 -212.615 547.83)" fill="#5DA753"/>
                <path d="M1294.73 173.285L1146.64 283.382L1111.4 151.831L1294.73 173.285Z" fill="#5DA753"/>
            </g>
            <g opacity="0.4">
                <rect width="1122.85" height="55.6494" transform="matrix(0.975448 -0.220231 0.220453 0.975398 -102.948 325.713)" fill="#5DA753"/>
                <path d="M1130.49 75.6592L1009.55 171.842L979.969 40.835L1130.49 75.6592Z" fill="#5DA753"/>
            </g>
            <rect width="1358.62" height="70.6387" transform="matrix(0.966396 -0.25706 0.257358 0.966316 -43.2815 701.307)" fill="#5DA753"/>
            <path d="M1437.02 343.871L1296.24 469.553L1252.39 304.808L1437.02 343.871Z" fill="#5DA753"/>
        </svg>
        <div class="content">
            <img id="Logo-VOLTA" src="assets/img/content/Logo_VOLTA.png" alt="Logo do Volta">
            <h1>Bem-vindo(a)</h1>
            <form>
                <label for="name">Nome:</label>
                <input type="text" id="name" name="name" placeholder="Nome da Empresa" required>
                <label for="email">E-mail:</label>
                <input type="email" id="email" name="email" placeholder="Email" required>
                <label for="cnpj">CNPJ:</label>
                <input type="text" id="cnpj" name="cnpj" placeholder="CNPJ" inputmode="numeric" maxlength="18" required>
                <label for="cep">CEP:</label>
                <input type="text" id="cep" name="cep" placeholder="CEP" inputmode="numeric" maxlength="9" required>
                <label for="senha">Senha:</label>
                <input type="password" id="senha" class="input-senha" name="senha" placeholder="Senha" required>
                <label for="confirmar-senha">Confirmar Senha:</label>
                <input type="password" id="confirmar-senha" class="input-senha" name="confirmar-senha" placeholder="Confirmar Senha" required>
                <button type="submit">Cadastre-se</button>
                <p>Já tem uma conta? <a href="login.html">Faça login</a></p>
            </form>
        </div>
    </div>
</body>
</html>
