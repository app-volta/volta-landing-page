<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="assets/img/content/logo.png" type="image/x-icon">
    <title>Volta - cadastrar</title>
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/login-cadastrar.css">
    <!--Fonte Belanosima-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Belanosima:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div id="container">
        <div class="lado-imagem" aria-hidden="true"></div>
        <div class="content">
            <a href="index.html">
                <img id="Logo-VOLTA" src="assets/img/content/Logo_VOLTA.png" alt="Logo do Volta">
            </a>
            <h1>Bem-vindo(a)!</h1>
            <h2>Cadastro</h2>
            <form>
                <label for="name">Nome:</label>
                <input type="text" id="name" name="name" placeholder="Nome da Empresa" required>
                <label for="email">E-mail:</label>
                <input type="email" id="email" name="email" placeholder="Email" required>
                <label for="cnpj">CNPJ:</label>
                <input type="text" id="cnpj" name="cnpj" placeholder="CNPJ" inputmode="numeric" maxlength="18" required>
                <label for="cep">CEP:</label>
                <input type="text" id="cep" name="cep" placeholder="CEP" inputmode="numeric" maxlength="9" required>
                <label for="senha">Senha:</label>
                <input type="password" id="senha" class="input-senha" name="senha" placeholder="Senha" required>
                <label for="confirmar-senha">Confirmar Senha:</label>
                <input type="password" id="confirmar-senha" class="input-senha" name="confirmar-senha" placeholder="Confirmar Senha" required>
                <button type="submit">Cadastre-se</button>
                <p>Já tem uma conta? <a href="login.html">Faça login</a></p>
            </form>
        </div>
    </div>
</body>
</html>
